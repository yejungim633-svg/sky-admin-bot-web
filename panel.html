
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Admin Bot | 관리 패널</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b1120;
  color:#f1f5f9;
  font-family:Arial,sans-serif;
}
header{
  height:75px;
  padding:0 30px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#111c30;
  border-bottom:1px solid #26344b;
}
.logo{font-size:21px;font-weight:bold}
main{max-width:1000px;margin:45px auto;padding:20px}
.card{
  background:#142137;
  border:1px solid #293b55;
  border-radius:13px;
  padding:25px;
  margin-bottom:20px;
}
h2{margin-top:0}
p{color:#a8b6ca}
button,select{
  padding:13px 17px;
  border:0;
  border-radius:8px;
  font-size:14px;
}
button{
  background:#5865f2;
  color:white;
  cursor:pointer;
}
button:hover{background:#4752c4}
select{
  width:100%;
  margin-top:12px;
  background:#0b1120;
  color:white;
  border:1px solid #40516b;
}
.hidden{display:none}
#status{margin-top:15px;color:#a5b4fc}
#serverInfo{margin-top:15px}
</style>
</head>
<body>

<header>
  <div class="logo">Sky Admin Bot</div>
  <button id="logoutBtn" class="hidden">로그아웃</button>
</header>

<main>

  <section class="card" id="loginBox">
    <h2>관리 패널 로그인</h2>
    <p>Discord 계정으로 로그인하세요.</p>
    <button id="loginBtn">Discord 로그인</button>
    <div id="loginStatus">로그인이 필요합니다.</div>
  </section>

  <section class="card hidden" id="dashboard">
    <h2>관리자 대시보드</h2>
    <p id="userInfo"></p>
    <p id="serverCount"></p>

    <h3>서버 선택</h3>
    <select id="serverSelect">
      <option value="">서버 불러오는 중...</option>
    </select>

    <div id="serverInfo"></div>
    <p id="status"></p>
  </section>

</main>

<script>
const loginBox = document.getElementById("loginBox");
const dashboard = document.getElementById("dashboard");
const loginStatus = document.getElementById("loginStatus");
const status = document.getElementById("status");
const serverSelect = document.getElementById("serverSelect");

document.getElementById("loginBtn").onclick = () => {
  location.href = "/auth/discord";
};

document.getElementById("logoutBtn").onclick = async () => {
  await fetch("/auth/logout", { method: "POST" });
  location.href = "/";
};

serverSelect.onchange = () => {
  const selected = serverSelect.options[serverSelect.selectedIndex];
  document.getElementById("serverInfo").textContent =
    serverSelect.value ? "선택한 서버: " + selected.text : "";
};

async function loadPanel() {
  try {
    const response = await fetch("/api/me");

    if (response.status === 401) {
      loginBox.classList.remove("hidden");
      dashboard.classList.add("hidden");
      return;
    }

    if (!response.ok) {
      throw new Error("서버 응답 오류: " + response.status);
    }

    const data = await response.json();

    loginBox.classList.add("hidden");
    dashboard.classList.remove("hidden");
    document.getElementById("logoutBtn").classList.remove("hidden");

    document.getElementById("userInfo").textContent =
      "로그인 계정: " +
      (data.user.global_name || data.user.username);

    const guilds = data.guilds || [];

    document.getElementById("serverCount").textContent =
      "참여 중인 서버: " + guilds.length + "개";

    serverSelect.innerHTML = "";

    if (guilds.length === 0) {
      serverSelect.add(new Option("참여 중인 서버가 없습니다.", ""));
    } else {
      serverSelect.add(new Option("서버를 선택하세요.", ""));

      guilds.forEach(guild => {
        serverSelect.add(new Option(guild.name, guild.id));
      });
    }

    status.textContent = "Discord 연결 성공";

  } catch (error) {
    loginStatus.textContent = "불러오기 실패: " + error.message;
    status.textContent = "불러오기 실패: " + error.message;
  }
}

loadPanel();
</script>

</body>
</html>
