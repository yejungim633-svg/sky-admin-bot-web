
<!DOCTYPE html>
<html lang="ko">
<head>

<title>Sky Admin Bot | 공식 홈페이지</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1120;color:white;font-family:Arial,sans-serif}
header{padding:22px 8%;border-bottom:1px solid #263449;font-size:22px;font-weight:bold}
main{max-width:1050px;margin:85px auto;padding:25px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:17px;margin-top:35px}
.card{background:#17243a;border:1px solid #293c58;padding:25px;border-radius:14px}

<body>

<main>

<p>서버 운영에 필요한 기능을 하나의 봇으로 관리하세요.</p>
<a class="btn" href="#features">기능 알아보기</a>
</section>

</div>

</div>

</div>
<div class="card">
<h2>개발자 안내</h2>
<p>개발 현황과 업데이트 및 시스템 정보를 확인합니다.</p>

</main>
<footer>SKY ADMIN BOT · Official Website</footer>

</html>
